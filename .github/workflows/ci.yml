name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Format check
        run: ruff format --check .
      - name: Test
        run: pytest

  test-lerobot:
    # The dataset writer and `taxel record` need LeRobot, which pulls torch. One Python version is enough.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        # The extra index serves CPU-only torch wheels, so the job does not download CUDA libraries.
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[lerobot,dev]" --extra-index-url https://download.pytorch.org/whl/cpu
      - name: Test
        run: pytest
