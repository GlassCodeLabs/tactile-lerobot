[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "taxel"
dynamic = ["version"]
description = "Tactile sensor backends and dataset metadata for robot learning recordings"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Vic Tejada" }]
keywords = ["tactile", "robotics", "sensors", "lerobot", "dataset"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering",
]
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff==0.17.3"]

[project.urls]
Homepage = "https://github.com/GlassCodeLabs/tactile-lerobot"
Issues = "https://github.com/GlassCodeLabs/tactile-lerobot/issues"

[tool.hatch.version]
path = "taxel/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["taxel"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["taxel"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = ["error"]
